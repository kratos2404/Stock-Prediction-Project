<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    
    <!-- Bootstrap for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Chart.js for graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-theme">

    <div class="container mt-5">
        <h1 class="text-center text-light">📈 Stock Price Prediction</h1>

        <!-- Input Form -->
        <div class="input-group mb-3 mt-4">
            <input type="text" id="ticker" class="form-control" placeholder="Enter Stock Ticker (e.g., AAPL)">
            <button class="btn btn-primary" onclick="getPrediction()">Predict</button>
        </div>
        <h1>Hello world</h1>
        <!-- Error Message -->
        <p id="error-message" class="text-danger text-center"></p>

        <!-- Prediction Results -->
        <div class="card bg-dark text-light p-4 mt-3">
            <h3 class="text-center">Predicted Prices for Next 3 Days</h3>
            <canvas id="predictionChart"></canvas>
            <!-- Add this inside the card (below the chart) -->
        <div id="loading" class="text-center mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Fetching Predictions...</p>
        </div>
        </div>
    </div>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
